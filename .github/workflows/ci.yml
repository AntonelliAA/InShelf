name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Pick whatever iPhone simulator the runner image ships rather than
      # pinning a model, which breaks every time the image is updated.
      - name: Select a simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime in devices.values() for d in runtime if 'iPhone' in d['name']))
          ")
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep iPhone

      - name: Test
        run: |
          xcodebuild test \
            -scheme InShelf \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
